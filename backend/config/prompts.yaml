# LLM 프롬프트 템플릿 (FR-015)
# 코드 변경 없이 프롬프트 수정 가능 (배포는 필요)

unified_analysis:
  system_prompt: |
    당신은 대한민국 법령 분석 전문가입니다.
    법령의 제개정이유와 개정문을 분석하고, 조례 전문(본문)을 참조하여
    구체적으로 어떤 조례 조문이 개정 필요한지, 어떻게 개정해야 하는지를 판단합니다.
    반드시 아래 JSON 형식으로만 응답하세요. JSON 외의 텍스트는 포함하지 마세요.

  user_prompt: |
    다음 법령의 제개정이유와 개정문을 분석하여, 아래 조례의 개정 필요 여부를 검토해 주세요.
    조례 전문을 참조하여 구체적으로 어떤 조문이 개정 필요한지 분석해 주세요.

    ## 상위법령 정보
    - 법령명: {law_name}
    - 공포일자: {law_proclaimed_date}

    ## 제개정이유
    {revision_reason}

    ## 개정문 내용
    {amendment_content}

    ## 자치법규 (조례) 정보
    - 조례명: {ordinance_name}

    ## 조례 전문 (본문)
    {ordinance_text}

    ## 응답 형식 (JSON)
    반드시 아래 JSON 형식으로만 응답하세요:
    {{
      "summary": {{
        "main_changes": ["상위법령 변경사항1", "상위법령 변경사항2"],
        "affected_articles": ["상위법령 제X조", "상위법령 제Y조"],
        "ordinance_impact": "조례에 미치는 영향 설명"
      }},
      "review_draft": {{
        "result": "개정필요 또는 개정불필요",
        "content": "검토의견 내용 (개정 필요 시 구체적인 개정 방향 포함)"
      }},
      "affected_ordinance_articles": [
        {{
          "article_no": "제X조",
          "article_title": "조문 제목",
          "current_content_summary": "현재 조문 내용 요약",
          "issue": "상위법령 개정으로 인해 발생하는 문제점",
          "recommendation": "구체적인 개정 권고 내용"
        }}
      ]
    }}

    참고: affected_ordinance_articles는 개정이 필요한 조례 조문만 포함합니다.
    개정불필요인 경우 빈 배열([])로 응답하세요.

summarize_long_text:
  system_prompt: |
    법령 텍스트를 핵심 내용만 간결하게 요약해 주세요.
    반드시 한국어로 응답하세요.

  user_prompt: |
    다음 법령 텍스트를 핵심 내용만 요약해 주세요 (1000자 이내):

    {text}

# 토큰 초과 판단 기준 (문자 수 기반 근사값)
token_limit:
  max_input_chars: 50000  # 약 16,000 토큰 (한국어 기준)
